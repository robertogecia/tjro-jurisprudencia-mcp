name: test

on:
  push:
  pull_request:

jobs:
  test:
    # v1.30.0: a extensão é distribuída para Windows, macOS e Linux; antes o CI só rodava em Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check server/index.js
